@if (toast(); as current) {
  <div class="toast" [class]="'toast--' + current.tone" role="status" aria-live="polite">
    <span>{{ current.message }}</span>
    <button
      type="button"
      class="toast__close"
      [attr.aria-label]="i18n.t('common.closeToast')"
      (click)="dismissed.emit()"
    >
      ✕
    </button>
  </div>
}
