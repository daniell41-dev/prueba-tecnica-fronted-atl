<label class="search-field">
  <span class="search-field__icon" aria-hidden="true">🔍</span>
  <input
    type="search"
    class="search-field__input"
    [value]="value()"
    [placeholder]="placeholder() ?? i18n.t('list.searchPlaceholder')"
    (input)="onInput($event)"
    [attr.aria-label]="i18n.t('common.searchAriaLabel')"
  />
  @if (value()) {
    <button
      type="button"
      class="search-field__clear"
      [attr.aria-label]="i18n.t('common.clearSearch')"
      (click)="clear()"
    >
      ✕
    </button>
  }
</label>
