<div class="language-switcher" role="group" [attr.aria-label]="switchAriaLabel()">
  @for (option of options(); track option.code) {
    <button
      type="button"
      class="language-switcher__btn"
      [class.language-switcher__btn--active]="option.code === active()"
      [attr.aria-pressed]="option.code === active()"
      [attr.aria-label]="option.label"
      [title]="option.label"
      (click)="localeChange.emit(option.code)"
    >
      <span aria-hidden="true">{{ option.flag }}</span>
    </button>
  }
</div>
