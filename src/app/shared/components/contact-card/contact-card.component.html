<app-avatar [firstName]="contact().firstName" [lastName]="contact().lastName" />

<span class="contact-card__body">
  <span class="contact-card__name">{{ fullName(contact()) }}</span>
  @if (contact().company; as company) {
    <span class="contact-card__meta">{{ company }}</span>
  } @else if (primaryPhone(contact()); as phone) {
    <span class="contact-card__meta">{{ phone | phoneFormat }}</span>
  }
</span>

<button
  type="button"
  class="contact-card__favorite"
  [class.contact-card__favorite--active]="contact().favorite"
  [attr.aria-pressed]="contact().favorite"
  [attr.aria-label]="contact().favorite ? i18n.t('common.removeFavorite') : i18n.t('common.addFavorite')"
  (click)="onToggleFavorite($event)"
>
  {{ contact().favorite ? '★' : '☆' }}
</button>
