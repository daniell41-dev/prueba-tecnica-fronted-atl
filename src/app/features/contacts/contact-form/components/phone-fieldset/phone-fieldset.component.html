<div class="phone-fieldset">
  @for (phone of array().controls; track $index) {
    <div class="phone-row" [formGroup]="phone">
      <select
        class="phone-row__label"
        formControlName="label"
        [attr.aria-label]="i18n.t('phone.typeAriaLabel')"
      >
        @for (key of labelOptions; track key) {
          <option [value]="key">{{ i18n.t(labelTranslationKeys[key]) }}</option>
        }
      </select>

      <div class="phone-row__number">
        <input
          type="tel"
          formControlName="number"
          [placeholder]="i18n.t('phone.numberPlaceholder')"
          [attr.aria-invalid]="phone.get('number')?.invalid && phone.get('number')?.touched"
        />
        @if (phone.get('number')?.touched) {
          <app-field-error [errors]="phone.get('number')?.errors ?? null" />
        }
      </div>

      <button
        type="button"
        class="phone-row__remove"
        [disabled]="!canRemove()"
        [attr.aria-label]="i18n.t('phone.remove', { n: $index + 1 })"
        (click)="removePhone($index)"
      >
        ✕
      </button>
    </div>
  }

  <button type="button" class="phone-fieldset__add" (click)="addPhone()">
    {{ i18n.t('phone.add') }}
  </button>
</div>
