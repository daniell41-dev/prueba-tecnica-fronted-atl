@if (notFound()) {
  <p class="form-hint">{{ i18n.t('form.notFound') }}</p>
  <a routerLink="/contacts" class="btn btn--ghost">{{ i18n.t('detail.backToList') }}</a>
} @else {
  <header class="page-header">
    <h1 class="page-header__title">
      {{ isEditMode ? i18n.t('form.titleEdit') : i18n.t('form.titleNew') }}
    </h1>
  </header>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
    <div class="field-row">
      <label class="field">
        <span class="field__label">{{ i18n.t('form.firstName') }}</span>
        <input
          type="text"
          formControlName="firstName"
          autocomplete="given-name"
          [attr.aria-invalid]="form.controls.firstName.invalid && form.controls.firstName.touched"
        />
        @if (form.controls.firstName.touched) {
          <app-field-error [errors]="form.controls.firstName.errors" />
        }
      </label>

      <label class="field">
        <span class="field__label">{{ i18n.t('form.lastName') }}</span>
        <input
          type="text"
          formControlName="lastName"
          autocomplete="family-name"
          [attr.aria-invalid]="form.controls.lastName.invalid && form.controls.lastName.touched"
        />
        @if (form.controls.lastName.touched) {
          <app-field-error [errors]="form.controls.lastName.errors" />
        }
      </label>
    </div>

    <label class="field">
      <span class="field__label">{{ i18n.t('form.email') }}</span>
      <input
        type="email"
        formControlName="email"
        autocomplete="email"
        [attr.aria-invalid]="form.controls.email.invalid && form.controls.email.touched"
      />
      @if (form.controls.email.touched) {
        <app-field-error [errors]="form.controls.email.errors" />
      }
    </label>

    <label class="field">
      <span class="field__label">{{ i18n.t('form.company') }}</span>
      <input type="text" formControlName="company" autocomplete="organization" />
      @if (form.controls.company.touched) {
        <app-field-error [errors]="form.controls.company.errors" />
      }
    </label>

    <fieldset class="field">
      <legend class="field__label">{{ i18n.t('form.phonesLegend') }}</legend>
      <app-phone-fieldset [array]="phones" />
      @if (phones.touched && phones.hasError('minArrayLength')) {
        <app-field-error [errors]="phones.errors" />
      }
    </fieldset>

    <div class="page-actions">
      <button type="button" class="btn btn--ghost" (click)="onCancel()">{{ i18n.t('form.cancel') }}</button>
      <button type="submit" class="btn btn--primary" [disabled]="saving()">
        {{ saving() ? i18n.t('form.saving') : i18n.t('form.save') }}
      </button>
    </div>
  </form>

  <app-confirm-dialog
    [open]="confirmingDiscard()"
    [title]="i18n.t('form.discardTitle')"
    [message]="i18n.t('form.discardMessage')"
    [confirmLabel]="i18n.t('form.discardConfirm')"
    [danger]="true"
    (confirmed)="confirmDiscard()"
    (cancelled)="cancelDiscard()"
  />
}
